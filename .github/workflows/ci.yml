name: CI

on:
  push:
  pull_request:

# Versions des outils NON-Python. Épinglées ici pour la même raison que ruff dans
# requirements-dev.txt : un linter est une dépendance, pas un outil ambiant. `ubuntu-24.04`
# plutôt qu'`ubuntu-latest` pour que GitHub ne change pas l'image sous nos pieds.
# Pour reproduire la CI en local : `deploy/lint-local.sh`.
#
# Les actions sont épinglées au SHA, même raison encore. `@v4` n'est pas une version, c'est
# une ÉTIQUETTE MOBILE que GitHub déplace : les actions bougeaient donc sous nos pieds
# exactement comme `ubuntu-latest` le faisait. C'est ce qui a fait apparaître, sans qu'une
# ligne du dépôt ne change, l'avertissement « target Node.js 20 but are being forced to run
# on Node.js 24 » — checkout@v4 et setup-python@v5 déclarent `using: node20` dans leur
# propre action.yml, or GitHub retire Node 20 de ses runners. Ce Node-là n'a rien à voir
# avec le nôtre (`node-version: "22"` plus bas) : c'est celui qui exécute les actions
# elles-mêmes, qui sont des programmes JavaScript fournis par GitHub.
#
# Le commentaire à droite de chaque SHA dit à quelle version il correspond — sans lui,
# l'épinglage devient illisible et personne ne le met plus à jour.
env:
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  lint:
    name: Lint (ruff + shellcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          # 3.11 comme les e2e : la version du boîtier. Toute version FIGÉE dans ce fichier
          # doit être celle-là — tests/test_versions_supportees.py le vérifie, sinon une
          # version se met à vivre sa vie dans un coin du workflow.
          python-version: "3.11"
          cache: pip
      - name: ruff (Python)
        # Tout le dépôt, pas seulement le paquet : les tests et scripts étaient hors
        # couverture, et 7 erreurs y sont passées inaperçues jusqu'au 2026-07-21.
        # (ruff respecte .gitignore, les archives locales sont donc exclues.)
        # Installé depuis requirements-dev.txt, qui épingle la version : un `pip install
        # ruff` libre rend le lint non reproductible (local et CI divergent), et ruff 0.16.0
        # a cassé `main` le 2026-07-26 en élargissant ses règles par défaut, sans qu'aucune
        # ligne de code ne change. Le jeu de règles est déclaré dans pyproject.toml.
        run: pip install -r requirements-dev.txt && ruff check .
      - name: shellcheck (scripts déploiement)
        # `run-dev.sh` inclus : il était hors couverture alors que c'est le script que
        # tout le monde lance en premier — ses deux pièges (bannière avant le bind,
        # dépendance au `python` du PATH) ont coûté une soirée le 2026-07-26.
        #
        # Version ÉPINGLÉE (comme ruff). `apt-get install shellcheck` servait la version
        # de l'image du jour : shellcheck varie beaucoup d'une version à l'autre (SC2015 a
        # déjà cassé la CI le 2026-07-12), donc une bascule d'`ubuntu-latest` suffisait à
        # faire rougir `main` sans qu'une ligne ne change — la cause racine exacte de la
        # panne ruff du 2026-07-26, restée en place ici jusqu'à l'audit 2026-07-28.
        run: |
          set -euo pipefail
          base="https://github.com/koalaman/shellcheck/releases/download"
          curl -fsSL "$base/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" | tar -xJ
          "shellcheck-v$SHELLCHECK_VERSION/shellcheck" --version
          "shellcheck-v$SHELLCHECK_VERSION/shellcheck" deploy/*.sh run-dev.sh

  unit:
    # MATRICE, et chaque cran répond à une question précise :
    #
    #   3.11  le boîtier D'AUJOURD'HUI. Raspberry Pi OS Bookworm (deploy/raspberry-pi.md),
    #         dont setup-pi.sh l. 65 prend le `python3` système. La CI testait 3.12 : elle
    #         n'avait JAMAIS testé ce qui tourne chez le client. C'est le plancher déclaré
    #         par `requires-python` dans pyproject.toml, et tests/test_versions_supportees.py
    #         interdit aux deux de diverger.
    #   3.12  la version de transition, encore installée sur les postes de dev.
    #   3.13  le boîtier de DEMAIN. Raspberry Pi OS Trixie (octobre 2025) embarque Debian 13
    #         et son Python 3.13 : c'est la version que prendra la prochaine réinstallation.
    #   3.14  vigie. Mesurée compatible le 2026-08-16 (597 unitaires verts sous 3.14.5), donc
    #         gratuite à surveiller : si elle rougit un jour, ce sera une DÉPENDANCE qui
    #         décroche, et on le saura avant que Pi OS n'y arrive.
    #
    name: Tests unitaires & intégration (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false          # un échec sur 3.14 ne doit pas masquer l'état de 3.11
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest + couverture
        # Le seuil (fail_under) est déclaré dans pyproject.toml : c'est un PLANCHER contre
        # la dérive silencieuse, pas une cible à négocier lot par lot. `coverage` est
        # épinglé dans requirements-dev.txt — un seuil mesuré par un outil qui bouge tout
        # seul ne veut rien dire (même raison que ruff, cf. 2026-07-26).
        run: |
          coverage run -m pytest -q     # le marqueur e2e est exclu par défaut (pyproject)
          coverage report

  js:
    name: Tests JavaScript (logique pure)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          # 24 : la seule LTS ACTIVE au 2026-08-19, maintenue jusqu'au 2028-04-30. La 22
          # qui était ici avait quitté le support actif le 2025-10-21 — dix mois en
          # maintenance sans que rien ne le signale, parce que Dependabot ne surveille pas
          # cette entrée (il suit les ACTIONS, pas leurs paramètres).
          #
          # Pas `lts/*` : ça résoudrait vers la dernière LTS à chaque exécution et
          # réintroduirait précisément la dérive qu'on a retirée partout ailleurs.
          # À REVOIR fin octobre 2026, quand la 26 deviendra LTS (support jusqu'en 2029).
          node-version: "24"
          cache: npm
      # `npm ci` installe EXACTEMENT le lockfile : vitest y est épinglé à la version
      # exacte, comme ruff côté Python.
      - run: npm ci
      # Ne teste que la logique PURE partagée par l'admin et l'écran (board, netmask,
      # ink). Rien de ce que npm installe ne part sur le boîtier : static/js reste du
      # JavaScript nu chargé par de simples <script>.
      - run: npm test

  e2e:
    name: Tests bout-en-bout (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          # 3.11, pas de matrice : c'est la version du boîtier, donc la seule dont l'échec
          # signifie « cassé chez le client ». Trois fois trois minutes de navigateur pour
          # couvrir des versions que personne n'exécute serait payer cher un renseignement
          # que la matrice unitaire donne déjà.
          python-version: "3.11"
          cache: pip
      - name: Dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Navigateur Chromium
        run: python -m playwright install --with-deps chromium
      - name: pytest e2e
        run: pytest tests/e2e -m e2e
