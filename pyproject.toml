[project]
# ComRoster n'est pas distribué comme paquet : il est déployé par `git clone` +
# deploy/setup-pi.sh. Cette section n'existe donc que pour UNE ligne, `requires-python`,
# qui manquait — la matrice de ci.yml était jusqu'ici la seule trace des versions
# supportées, et une matrice de CI ne se lit pas depuis le code.
#
# Le plancher n'est pas une préférence : Raspberry Pi OS Bookworm, cible documentée dans
# deploy/raspberry-pi.md, embarque Python 3.11, et deploy/setup-pi.sh crée le venv du
# boîtier avec le `python3` du système. Descendre sous 3.11 n'aurait pas de sens ; y
# renoncer non plus, tant que des boîtiers Bookworm tournent.
#
# Effet second, dans le sens INVERSE de ce qu'on croit : sans `requires-python`, ruff
# retombe sur une cible ANCIENNE et se tait sur les modernisations. En le déclarant, il
# vise py311 et a immédiatement signalé 14 `datetime.timezone.utc` remplaçables par
# `datetime.UTC` (ajouté en 3.11) — corrigés le 2026-08-16. Déclarer un plancher ne bride
# donc pas le lint, ça le débloque : il ne pouvait pas deviner ce qu'on s'autorisait.
#
# Les dépendances restent dans requirements.txt et n'ont RIEN à faire ici : c'est ce
# fichier-là qu'installe le boîtier, et deux listes finiraient par diverger.
name = "comroster"
version = "0.0.0"          # jamais publié ; la version qui compte est le SHA git
requires-python = ">=3.11"

[tool.pytest.ini_options]
# SOURCE UNIQUE de la configuration pytest. Un `pytest.ini` a coexisté avec cette section :
# or pytest.ini l'emporte TOUJOURS sur pyproject.toml, celle-ci n'était donc jamais lue —
# une modification faite ici serait restée sans effet, en silence (audit 2026-07-28).
# Ne pas recréer pytest.ini / setup.cfg / tox.ini : ils reprendraient la priorité.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: tests bout-en-bout via navigateur Playwright (exclus par défaut, lancer avec -m e2e)",
]
addopts = "-m 'not e2e'"

[tool.coverage.run]
source = ["comroster"]
branch = true

[tool.coverage.report]
# Seuil PLANCHER, pas cible : la couverture mesurée à l'audit du 2026-07-28 était de 90 %.
# Le poser à ce niveau interdit la dérive silencieuse sans transformer chaque correctif en
# négociation de pourcentage. À relever quand il devient confortable, jamais à abaisser
# pour faire passer un lot.
fail_under = 88
show_missing = true
exclude_also = [
    # Point d'entrée d'un script : exécuté par systemd, jamais par la suite de tests.
    'if __name__ == .__main__.:',
]

[tool.ruff.lint]
# Jeu de règles DÉCLARÉ, jamais hérité. Sans cette section, ruff applique les règles
# par défaut de la version installée : l'élargissement de ces défauts en 0.16.0 a fait
# passer `main` au rouge le 2026-07-26 sans qu'une seule ligne de code ne change
# (50 signalements apparus d'un coup). Élargir ce jeu est donc une décision explicite,
# jamais l'effet de bord d'une mise à jour.
select = [
    "E4", "E7", "E9", "F",  # défauts historiques : erreurs réelles, imports et noms inconnus
    "I",                    # tri des imports (déterministe, corrigé automatiquement)
    "UP",                   # modernisation, bornée par `requires-python` : ruff en déduit
                            # py311 et ne propose donc rien que le boîtier ne saurait
                            # exécuter. (Avant, sans plancher déclaré, il visait la
                            # dernière version qu'il connaissait.)
    "B",                    # pièges courants (bugbear)
    "C4",                   # compréhensions inutiles
    "SIM",                  # simplifications lisibles
    "RUF",                  # règles propres à ruff
    "DTZ",                  # datetime naïfs — l'app horodate des affectations
    "BLE",                  # `except Exception` nu : masque les vraies pannes
    "FLY", "FURB",          # idiomes (join statique → f-string, écriture en boucle)
    "PLE", "PLW",           # erreurs et avertissements pylint (dont subprocess sans check=)
    "S110",                 # try/except/pass muet — le reste de `S` est inexploitable ici
]

# Base de code francophone : commentaires, docstrings et libellés d'interface sont en
# français. RUF001-003 traquent les homoglyphes trompeurs dans du code ASCII (`×` pris
# pour `x`, `е` cyrillique pour `e`) ; sur du texte français assumé ils ne signalent que
# de la typographie légitime.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Les tests de parseurs construisent des sorties nmcli avec `"\n".join([...])` : une
# ligne de source par ligne de sortie, chacune commentée (« SSID vide → ignoré »,
# « sécurité vide → réseau ouvert »). Un littéral unique ferait perdre ces commentaires,
# qui sont l'essentiel du cas de test. FLY002 se trompe de cible ici.
"tests/*" = ["FLY002"]
