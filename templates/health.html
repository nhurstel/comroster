<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santé du boîtier · ComRoster</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/comroster-badge.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-page health-page">
  <div class="admin-app">
    <header class="admin-top">
      <a class="brand" href="{{ url_for('api.admin_page') }}" title="Retour aux affectations">
        <img class="admin-badge" src="{{ url_for('static', filename='img/comroster-glyph.svg') }}" alt="" width="18" height="18">
        <span class="side-name">ComRoster</span>
      </a>
      <div class="crumb">
        <b>Santé du boîtier</b>
        <span class="crumb-sep">/</span>
        <span class="crumb-sub">monitoring de l'appliance</span>
      </div>
      <nav class="admin-tabs">
        <a class="tab" href="{{ url_for('api.admin_page') }}">← Affectations</a>
      </nav>
      <div class="top-right">
        <span class="chip clock" id="health-updated" title="Dernière actualisation">—</span>
      </div>
    </header>

    <div class="health-body">
      <div class="health-cards" id="health-cards"></div>
    </div>

    <footer class="admin-status">
      <span class="s" id="status-info">chargement…</span>
      <span class="s status-right">actualisation automatique · 4 s</span>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='js/health.js') }}"></script>
</body>
</html>
